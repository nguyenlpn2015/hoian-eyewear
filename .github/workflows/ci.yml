name: CI / Quality & Security Checks

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://wejvdyczkvluphqvtrab.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_dummy_ci_key"
      SUPABASE_SERVICE_ROLE_KEY: "sb_secret_dummy_ci_key"
      ENABLE_DEV_LOGIN: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint
        run: npm run lint

      - name: Security & Regression Test Suite
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: "production"

